<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c1c3e" />
    <link rel="icon" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Primary SEO -->
    <title>Bazaar — Honest prices, curated finds</title>
    <meta name="description" content="Shop curated products sourced directly by us, or find trusted picks from Flipkart and other partners — all in one place, with clear pricing and no guesswork." />
    <meta name="keywords" content="online store, shop India, curated products, Flipkart deals, affiliate shopping" />
    <link rel="canonical" href="https://www.yourdomain.com/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bazaar — Honest prices, curated finds" />
    <meta property="og:description" content="Shop curated products sourced directly by us, or find trusted picks from partner stores — all in one place." />
    <meta property="og:url" content="https://www.yourdomain.com/" />
    <meta property="og:image" content="https://www.yourdomain.com/logo.png" />
    <meta property="og:site_name" content="Bazaar" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bazaar — Honest prices, curated finds" />
    <meta name="twitter:description" content="Shop curated products sourced directly by us, or find trusted picks from partner stores." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bazaar",
      "url": "https://www.yourdomain.com/",
      "description": "Curated online store with direct-sold and affiliate-partner products."
    }
    </script>
  </head>
  <body>
    <noscript>Is website ko dekhne ke liye JavaScript on karo.</noscript>
    <div id="root"></div>
  </body>
</html>
